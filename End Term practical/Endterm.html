<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Student Marks & Grade Calculator</h2>

    <label>Number of Subjects:</label>
    <input type="number" id="subjects">
    <button onclick="calculateGrade()">Calculate</button>

    <h3 id="result"></h3>

    <script>
        function calculateGrade() {
            let n = parseInt(document.getElementById("subjects").value);

            let total = 0;

            for(let i = 1; i <= n; i++) {
                let marks = parseFloat(prompt("Enter marks of Subject " + i));
                total += marks;
            }

            let average = total / n;
            let grade;

            if(average >= 90)
                grade = "A+";
            else if(average >= 75)
                grade = "A";
            else if(average >= 60)
                grade = "B";
            else if(average >= 40)
                grade = "C";
            else
                grade = "Fail";

            document.getElementById("result").innerHTML =
                "Total Marks = " + total +
                "<br>Average = " + average.toFixed(2) +
                "<br>Grade = " + grade;
        }
    </script>

</body>
</html>
